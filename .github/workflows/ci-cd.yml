name: CI/CD

on:
  push:
    branches:
      - feat/motion-system
  pull_request:
    branches:
      - feat/motion-system

concurrency:
  group: papercodes-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  deploy:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/motion-system'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger signed Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const url = process.env.COOLIFY_WEBHOOK_URL;
          const secret = process.env.COOLIFY_WEBHOOK_SECRET;

          if (!url || !secret) {
            throw new Error("Coolify webhook configuration is missing.");
          }

          const body = fs.readFileSync(process.env.GITHUB_EVENT_PATH);
          const signature = crypto
            .createHmac("sha256", secret)
            .update(body)
            .digest("hex");

          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "User-Agent": "papercodes-site-ci",
              "X-GitHub-Delivery": crypto.randomUUID(),
              "X-GitHub-Event": "push",
              "X-Hub-Signature-256": `sha256=${signature}`,
            },
            body,
          });

          const responseText = await response.text();
          if (!response.ok) {
            throw new Error(
              `Coolify webhook failed (${response.status}): ${responseText}`,
            );
          }

          let result;
          try {
            result = JSON.parse(responseText);
          } catch {
            throw new Error(`Coolify returned an invalid response: ${responseText}`);
          }

          const deployment = Array.isArray(result)
            ? result.find((item) => item.status === "success")
            : undefined;

          if (!deployment?.deployment_uuid) {
            throw new Error(`Coolify did not queue a deployment: ${responseText}`);
          }

          console.log(`Coolify deployment queued: ${deployment.deployment_uuid}`);
          NODE
